  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand"><img src="assets/img/logo.png" class="logo" alt="" width="34" height="34" decoding="async" /> IQ<b>.</b>T3ani</a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-ar="الرئيسية">Home</a>
        <a href="courses.html" data-ar="الكورسات">Courses</a>

        <a href="dashboard.html" data-ar="لوحتي">Dashboard</a>
        <a href="qi.html">IQ</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn lang-btn" id="langBtn" title="Language / اللغة" aria-label="Switch language / تبديل اللغة"><span id="langText">ع</span></button>
        <button class="icon-btn" id="themeBtn" title="Theme / المظهر" aria-label="Toggle theme / تبديل المظهر"><span id="themeIcon">🌙</span></button>
        <button class="icon-btn nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="ide-wrap" id="ideWrap" role="main">

    <!-- Toolbar -->
    <div class="ide-toolbar">
      <div class="ide-title">
        <span>💻</span>
        <span data-ar="محرر الأكواد">Code Playground</span>
      </div>
      <button class="ide-tbtn" data-action="templates" title="Templates">📋 <span data-ar="قوالب">Templates</span></button>
      <button class="ide-tbtn" data-action="format" title="Format (Auto-indent)">✨ <span data-ar="تنسيق">Format</span></button>
      <button class="ide-tbtn" data-action="split" title="Toggle split direction">⬒ <span data-ar="تقسيم">Split</span></button>
      <button class="ide-tbtn" data-action="save" title="Save (Ctrl+S)">💾 <span data-ar="حفظ">Save</span></button>
      <button class="ide-tbtn" data-action="download" title="Download ZIP">📦 <span data-ar="تحميل">Download</span></button>
      <button class="ide-tbtn primary" data-action="run" title="Run (Ctrl+Enter)">▶ <span data-ar="شغّل">Run</span></button>
    </div>

    <!-- Main split area -->
    <div class="ide-main">

      <!-- Editor pane -->
      <div class="ide-editor-pane">
        <div class="ide-tabs">
          <!-- Tabs are built dynamically -->
          <button class="ide-tab-add" title="New file">+</button>
        </div>
        <div class="ide-cm-wrap"></div>
      </div>

      <!-- Resizer -->
      <div class="ide-resizer"></div>

      <!-- Output pane -->
      <div class="ide-output-pane">
        <div class="ide-output-tabs">
          <button class="ide-out-tab active" data-out="preview" data-ar="معاينة">Preview</button>
          <button class="ide-out-tab" data-out="console">Console</button>
          <button class="ide-tbtn" data-action="clear" style="margin-inline-start:auto;padding:4px 10px;font-size:.75rem" data-ar="مسح">Clear</button>
        </div>
        <iframe class="ide-preview" sandbox="allow-scripts allow-same-origin" title="Preview"></iframe>
        <div class="ide-console hidden"></div>
        <div class="ide-console-input" style="display:none">
          <input type="text" placeholder="> type JS here..." data-ar-ph="> اكتب JS هنا..." />
        </div>
      </div>

    </div>

    <!-- Status bar -->
    <div class="ide-status">
      <span class="ide-status-cur">Ln 1, Col 1</span>
      <div class="ide-status-right">
        <span class="ide-status-lang">HTML</span>
        <span>IQ.T3ani Playground</span>
      </div>
    </div>

  </div>

  <!-- Templates dialog -->
  <div class="ide-tpl-overlay">
    <div class="ide-tpl-dialog">
      <h3 data-ar="اختر قالب">Choose a template</h3>
      <div class="ide-tpl-list"></div>
    </div>
  </div>
