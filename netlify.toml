# Netlify configuration for the IQ.T3ani static site.
# No build step — the site is plain HTML/CSS/JS served from the publish root.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# ---- Security headers (applied to every response) ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # CSP notes:
    # - youtube.com / ytimg.com are required by the custom lesson video player
    #   (YouTube IFrame API): script + frame + thumbnails.
    # - cdnjs is required by Skulpt (in-browser Python) and CodeMirror (editor).
    # - 'unsafe-eval' is required by Skulpt; 'unsafe-inline' script allows the
    #   tiny theme-init snippet in each page head. For A+ hardening replace it
    #   with per-snippet hashes. When a backend API exists, add its origin to
    #   connect-src (e.g. https://api.iqt3ani.com).
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https://i.ytimg.com https://s.ytimg.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://www.youtube.com https://s.ytimg.com https://www.googletagmanager.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.youtube.com https://generativelanguage.googleapis.com https://text.pollinations.ai https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' https://*.googlevideo.com; worker-src 'self'; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests"

# ---- Caching ----
# HTML: always revalidate (Netlify ETags make this a cheap 304 when unchanged)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker must never be cached long — it controls all future updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS/JS are not content-hashed, so avoid year-long immutable caching:
# 1 hour fresh + a day of stale-while-revalidate keeps updates flowing fast.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Images / icons change rarely
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
